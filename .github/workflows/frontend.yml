# Frontend CI: TypeScript + ESLint only.
#
# Full Expo / emulator E2E is out of scope for CI (runner cost and device
# setup). Product UI verification remains manual (local Expo / device).
#
# Live pass/fail in Actions is proven only after this workflow is pushed to a
# branch GitHub can run — YAML review alone does not prove CI.

name: frontend

on:
  push:
    branches: [master, module-16-ci-proof]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
