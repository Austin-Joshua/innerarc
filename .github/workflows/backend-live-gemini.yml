# Optional live Gemini CI: real API calls for coach + plate vision.
# Skipped entirely when GEMINI_API_KEY is not configured (no failure).
# Red on this workflow = live Gemini path failed (quota, billing, API) — not deterministic logic.
#
# Secret: repository secret GEMINI_API_KEY, or Environment "Env" (gate job uses Env).
# Does not block pushes when skipped; deterministic workflow always runs separately.

name: backend (live Gemini)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  gate:
    name: check GEMINI_API_KEY present
    runs-on: ubuntu-latest
    environment: Env
    outputs:
      gemini_key_configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${GEMINI_API_KEY}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "GEMINI_API_KEY is set (length ${#GEMINI_API_KEY})"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GEMINI_API_KEY not set — skipping live Gemini smokes"
          fi

  live-gemini-smokes:
    name: live Gemini smokes
    needs: gate
    if: needs.gate.outputs.gemini_key_configured == 'true'
    runs-on: ubuntu-latest
    environment: Env
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: innerarc
          POSTGRES_PASSWORD: innerarc
          POSTGRES_DB: innerarc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U innerarc -d innerarc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://innerarc:innerarc@localhost:5432/innerarc
      OBJECT_STORAGE_PATH: ../data/photos
      JWT_SECRET: innerarc-dev-secret-change-me-32b+
      JWT_EXPIRE_MINUTES: "10080"
      CLASSIFIER_CHECKPOINT: ../ml/checkpoints/best.pt
      CLASSIFIER_STUB_MODE: "true"
      POSE_LANDMARKER_MODEL: ../ml/checkpoints/pose_landmarker_lite.task
      CORS_ORIGINS: http://localhost:8081,http://localhost:19006
      GEMINI_ENABLED: "true"
      GEMINI_MODEL: gemini-3.5-flash
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PHOTO_ENCRYPTION_KEY: ""
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Write root .env for pydantic-settings
        working-directory: .
        run: |
          PHOTO_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          {
            echo "POSTGRES_USER=innerarc"
            echo "POSTGRES_PASSWORD=innerarc"
            echo "POSTGRES_DB=innerarc"
            echo "POSTGRES_PORT=5432"
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "OBJECT_STORAGE_PATH=${OBJECT_STORAGE_PATH}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES}"
            echo "CLASSIFIER_CHECKPOINT=${CLASSIFIER_CHECKPOINT}"
            echo "CLASSIFIER_STUB_MODE=${CLASSIFIER_STUB_MODE}"
            echo "POSE_LANDMARKER_MODEL=${POSE_LANDMARKER_MODEL}"
            echo "CORS_ORIGINS=${CORS_ORIGINS}"
            echo "GEMINI_ENABLED=${GEMINI_ENABLED}"
            echo "GEMINI_MODEL=${GEMINI_MODEL}"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "PHOTO_ENCRYPTION_KEY=${PHOTO_ENCRYPTION_KEY}"
          } > .env
          echo "PHOTO_ENCRYPTION_KEY=${PHOTO_ENCRYPTION_KEY}" >> "$GITHUB_ENV"

      - name: Migrate database
        run: alembic upgrade head

      - name: Seed food and workouts
        run: |
          python -u scripts/seed_food.py
          python -u scripts/seed_workouts.py

      - name: Download plate smoke fixtures (Wikimedia Commons)
        working-directory: .
        run: |
          mkdir -p backend/scripts/fixtures/plates
          curl -fsSL -o backend/scripts/fixtures/plates/01_vegetarian_thali.jpg \
            "https://commons.wikimedia.org/wiki/Special:FilePath/Vegetarian_Thali.jpg"
          curl -fsSL -o backend/scripts/fixtures/plates/02_north_indian_thali.jpg \
            "https://commons.wikimedia.org/wiki/Special:FilePath/A_Tipical_Veg_North_Indian_Thali.jpg"
          curl -fsSL -o backend/scripts/fixtures/plates/03_south_indian_thali.jpg \
            "https://commons.wikimedia.org/wiki/Special:FilePath/An_ideal_South_Indian_Thali.jpg"
          curl -fsSL -o backend/scripts/fixtures/plates/04_indian_thali.jpg \
            "https://commons.wikimedia.org/wiki/Special:FilePath/Indian_Thali.jpg"
          ls -la backend/scripts/fixtures/plates/*.jpg

      - name: Run smoke_coach (live Gemini)
        run: python -u scripts/smoke_coach.py

      - name: Run smoke_plate (live Gemini Vision)
        run: python -u scripts/smoke_plate.py
