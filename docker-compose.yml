services:
  postgres:
    image: postgres:16
    # Optional fixed name — override via POSTGRES_CONTAINER_NAME when 5432 /
    # the default name is already taken. Omit entirely in an override file if
    # you want Compose to auto-name as {project}_postgres_1 (best for parallel stacks).
    container_name: ${POSTGRES_CONTAINER_NAME:-innerarc-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-innerarc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-innerarc}
      POSTGRES_DB: ${POSTGRES_DB:-innerarc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - innerarc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-innerarc} -d ${POSTGRES_DB:-innerarc}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  innerarc_pgdata:
